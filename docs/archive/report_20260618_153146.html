<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>多周期K线图报告 · 2026年06月18日 15:31</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #333333;
    font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
    padding: 24px 20px 40px;
  }

  /* ── 顶部标题 ── */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 {
    font-size: 22px;
    color: #111111;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .header .sub {
    font-size: 13px;
    color: #888;
    margin-top: 6px;
  }

  /* ── 二列网格 ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ── 卡片 ── */
  .card {
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
  }
  .card:hover {
    border-color: #3a6ea8;
    box-shadow: 0 0 12px rgba(58,110,168,.2);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: #eeeeee;
    border-bottom: 1px solid #ddd;
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    color: #222222;
    letter-spacing: 0.5px;
  }
  .ma260-dev {
    font-size: 13px;
    font-weight: 700;
    margin-left: 10px;
    letter-spacing: 0.5px;
  }
  .meta { font-size: 13px; }
  .price { color: #333333; margin-right: 4px; }
  .chg   { font-weight: 600; }

  .card img {
    width: 100%;
    display: block;
    cursor: zoom-in;
  }

  /* ── 灯箱 ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
  }
  #lightbox.active { display: flex; }
  #lb-img-wrap {
    position: relative;
    overflow: hidden;
    width: 95vw;
    height: 88vh;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
  }
  #lb-img-wrap.dragging { cursor: grabbing; }
  #lb-img {
    max-width: none;
    max-height: none;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,.8);
    transform-origin: center center;
    user-select: none;
    pointer-events: none;
    transition: none;
  }
  #lightbox .lb-label {
    margin-top: 8px;
    font-size: 13px;
    color: #888;
    flex-shrink: 0;
  }
  #lightbox .lb-hint {
    font-size: 11px;
    color: #444;
    margin-top: 3px;
    flex-shrink: 0;
  }
  #lightbox .lb-close {
    position: absolute;
    top: 14px; right: 20px;
    font-size: 26px;
    color: #555;
    cursor: pointer;
    line-height: 1;
    z-index: 10;
  }
  #lightbox .lb-close:hover { color: #ccc; }
  #lb-zoom-reset {
    position: absolute;
    bottom: 14px; right: 20px;
    font-size: 12px;
    color: #aaa;
    cursor: pointer;
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 3px 9px;
  }
  #lb-zoom-reset:hover { color: #fff; border-color: #888; }

  /* ── 页脚 ── */
  .footer {
    text-align: center;
    margin-top: 36px;
    font-size: 12px;
    color: #aaa;
  }

  /* ── 收盘点评区域 ── */
  .market-panel {
    max-width: 1600px;
    margin: 0 auto 28px;
    background: #f5f7fa;
    border: 1px solid #e0e4ea;
    border-radius: 10px;
    padding: 18px 24px;
  }
  .market-panel .panel-title {
    font-size: 15px;
    font-weight: 700;
    color: #222;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e0e4ea;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .market-panel .panel-title .pt-time {
    font-size: 12px;
    font-weight: 400;
    color: #999;
    margin-left: auto;
  }
  /* 左右分栏 */
  .market-body {
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }
  .market-left {
    flex: 1 1 0;
    min-width: 0;
  }
  .market-right {
    flex: 1 1 0;
    min-width: 0;
  }
  .chart-title {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
  }
  #amountChart {
    width: 100%;
    height: 200px;
    display: block;
  }
  /* 指数表格 */
  .idx-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .idx-table th {
    text-align: center;
    color: #888;
    font-weight: 500;
    padding: 4px 8px;
    border-bottom: 1px solid #e8e8e8;
  }
  .idx-table th:first-child { text-align: left; }
  .idx-table td {
    text-align: center;
    padding: 6px 8px;
    border-bottom: 1px solid #f0f0f0;
    white-space: nowrap;
  }
  .idx-table td:first-child { text-align: left; font-weight: 600; color: #333; }
  .idx-table tr:last-child td { border-bottom: none; }
  .up   { color: #e03030; font-weight: 600; }
  .down { color: #0aa855; font-weight: 600; }
  .flat-c { color: #888; }
  /* 成交额汇总行 */
  .amount-row {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 13px;
    color: #555;
  }
  .amount-row .amt-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .amount-row .amt-label { color: #999; }
  .amount-row .amt-val   { font-weight: 600; color: #333; font-size: 14px; }
  .amount-row .amt-total { color: #1a6fc4; font-weight: 700; font-size: 15px; }

  /* ── 板块与资金面板 ── */
  .sector-panel {
    max-width: 1600px;
    margin: 0 auto 28px;
    background: #f5f7fa;
    border: 1px solid #e0e4ea;
    border-radius: 10px;
    padding: 18px 24px;
  }
  .sector-panel .panel-title {
    font-size: 15px;
    font-weight: 700;
    color: #222;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e0e4ea;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* 四列网格：概念涨/跌 + 行业涨/跌 */
  .sector-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .sector-col-title {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
    font-weight: 500;
    padding-bottom: 4px;
    border-bottom: 1px solid #eee;
  }
  .sector-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid #f5f5f5;
  }
  .sector-item:last-child { border-bottom: none; }
  .sector-name { color: #333; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sector-pct  { font-weight: 600; min-width: 52px; text-align: right; }
  /* 资金流向区域 */
  .fund-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }
  .fund-col-title {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
    font-weight: 500;
    padding-bottom: 4px;
    border-bottom: 1px solid #eee;
  }
  .fund-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 13px;
    border-bottom: 1px solid #f5f5f5;
  }
  .fund-item:last-child { border-bottom: none; }
  .fund-name   { color: #333; flex: 1; }
  .fund-amount { font-weight: 600; min-width: 60px; text-align: right; }
  /* 主力资金净流入汇总条 */
  .fund-summary {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: #eef2f8;
    border-radius: 6px;
    font-size: 13px;
  }
  .fund-summary .fs-item { display: flex; align-items: center; gap: 6px; }
  .fund-summary .fs-label { color: #888; }
  .fund-summary .fs-val   { font-weight: 700; font-size: 14px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .market-body { flex-direction: column; }
    .market-left { min-width: 0; width: 100%; }
    #amountChart { height: 160px; }
    .sector-grid { grid-template-columns: repeat(2, 1fr); }
    .fund-row    { grid-template-columns: 1fr; }
  }
</style>

<!-- 灯箱 -->
<div id="lightbox">
  <span class="lb-close" onclick="closeLightbox()">✕</span>
  <div id="lb-img-wrap">
    <img id="lb-img" src="" alt="" draggable="false" />
  </div>
  <div class="lb-label" id="lb-label"></div>
  <div class="lb-hint">双指缩放/滚轮缩放 &nbsp;·&nbsp; 拖拽平移 &nbsp;·&nbsp; 双击还原 &nbsp;·&nbsp; Esc 关闭</div>
  <span id="lb-zoom-reset" onclick="resetTransform()">还原</span>
</div>

<script>
(function() {
  var lb      = document.getElementById('lightbox');
  var wrap    = document.getElementById('lb-img-wrap');
  var img     = document.getElementById('lb-img');
  var lbLabel = document.getElementById('lb-label');

  var scale = 1, tx = 0, ty = 0;
  var dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
  var MIN_SCALE = 0.5, MAX_SCALE = 10;

  function applyTransform() {
    img.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
  }

  window.resetTransform = function() {
    scale = 1; tx = 0; ty = 0;
    applyTransform();
  };

  window.openLightbox = function(src, label) {
    img.src = src;
    lbLabel.textContent = label;
    lb.classList.add('active');
    resetTransform();
    event.stopPropagation();
  };

  window.closeLightbox = function() {
    lb.classList.remove('active');
    img.src = '';
    resetTransform();
  };

  // 滚轮缩放（以鼠标位置为缩放中心）
  wrap.addEventListener('wheel', function(e) {
    e.preventDefault();
    var rect  = img.getBoundingClientRect();
    var mx    = e.clientX - (rect.left + rect.width  / 2);
    var my    = e.clientY - (rect.top  + rect.height / 2);
    var delta = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    var newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * delta));
    var ratio    = newScale / scale;
    tx = tx * ratio + mx * (1 - ratio);
    ty = ty * ratio + my * (1 - ratio);
    scale = newScale;
    applyTransform();
  }, { passive: false });

  // 拖拽平移
  wrap.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startTx = tx; startTy = ty;
    wrap.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    tx = startTx + (e.clientX - startX);
    ty = startTy + (e.clientY - startY);
    applyTransform();
  });
  window.addEventListener('mouseup', function() {
    dragging = false;
    wrap.classList.remove('dragging');
  });

  // 双击还原
  wrap.addEventListener('dblclick', function(e) {
    e.stopPropagation();
    resetTransform();
  });

  // ── 触摸事件（手机/平板）──────────────────────────────
  var touchStartDist = 0;   // 双指初始距离
  var touchStartScale = 1;  // 双指开始时的 scale
  var touchStartMidX = 0, touchStartMidY = 0; // 双指中点（屏幕坐标）
  var touchStartTx = 0, touchStartTy = 0;     // 双指开始时的位移
  var singleStartX = 0, singleStartY = 0;     // 单指起始
  var singleStartTx = 0, singleStartTy = 0;
  var isSingleTouch = false;

  function getTouchDist(t) {
    var dx = t[0].clientX - t[1].clientX;
    var dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function getTouchMid(t) {
    return {
      x: (t[0].clientX + t[1].clientX) / 2,
      y: (t[0].clientY + t[1].clientY) / 2
    };
  }

  wrap.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touches = e.touches;
    if (touches.length === 1) {
      isSingleTouch = true;
      singleStartX  = touches[0].clientX;
      singleStartY  = touches[0].clientY;
      singleStartTx = tx;
      singleStartTy = ty;
    } else if (touches.length === 2) {
      isSingleTouch  = false;
      touchStartDist  = getTouchDist(touches);
      touchStartScale = scale;
      var mid         = getTouchMid(touches);
      touchStartMidX  = mid.x;
      touchStartMidY  = mid.y;
      touchStartTx    = tx;
      touchStartTy    = ty;
    }
  }, { passive: false });

  wrap.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var touches = e.touches;
    if (touches.length === 1 && isSingleTouch) {
      // 单指拖拽
      tx = singleStartTx + (touches[0].clientX - singleStartX);
      ty = singleStartTy + (touches[0].clientY - singleStartY);
      applyTransform();
    } else if (touches.length === 2) {
      // 双指缩放（以两指中点为缩放中心）
      var dist     = getTouchDist(touches);
      var newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, touchStartScale * dist / touchStartDist));
      var ratio    = newScale / touchStartScale;
      var rect     = img.getBoundingClientRect();
      var cx       = touchStartMidX - (rect.left + rect.width  / 2);
      var cy       = touchStartMidY - (rect.top  + rect.height / 2);
      tx = touchStartTx * ratio + cx * (1 - ratio);
      ty = touchStartTy * ratio + cy * (1 - ratio);
      scale = newScale;
      applyTransform();
    }
  }, { passive: false });

  wrap.addEventListener('touchend', function(e) {
    // 双指结束，剩1指时重置单指起点，避免跳动
    if (e.touches.length === 1) {
      isSingleTouch  = true;
      singleStartX   = e.touches[0].clientX;
      singleStartY   = e.touches[0].clientY;
      singleStartTx  = tx;
      singleStartTy  = ty;
    }
  }, { passive: false });

  // 点击背景关闭（非图片区域）
  lb.addEventListener('click', function(e) {
    if (e.target === lb) closeLightbox();
  });

  document.addEventListener('keydown', function(e) {
    if (!lb.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === '0') resetTransform();
  });
})();
</script>
